<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversion card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500..800&amp;family=Instrument+Sans:wdth,wght@85..100,400..700&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 630px; box-sizing: border-box; background: #191430; color: #F3EFFA; font-family: 'Instrument Sans', sans-serif; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 56px; padding: 48px 64px 44px 56px; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: relative; height: 534px; border-radius: 999px 999px 8px 8px; border: 8px solid #0E0A1E; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0E0A1E">
    <div style="display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 8px">
      <span style="background: {{fromColor}}; opacity: .55"></span><span style="background: {{fromColor}}; opacity: .4"></span><span style="background: {{fromColor}}; opacity: .25"></span>
    </div>
    <div style="display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 8px">
      <span style="background: {{toColor}}"></span><span style="background: {{toColor}}; filter: brightness(1.15)"></span><span style="background: {{toColor}}"></span>
    </div>
    <span style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); border-radius: 50%; border: 8px solid #0E0A1E; background: #E7BE57; display: grid; place-items: center; font-family: 'Grenze Gotisch', serif; font-size: 44px; color: #1C1430">{{glyph}}</span>
  </div>
  <div style="display: flex; flex-direction: column; min-width: 0">
    <span style="font-size: 22px; color: #C9C0E3">{{kicker}}</span>
    <h1 style="margin: 14px 0 0; font-family: 'Grenze Gotisch', serif; font-weight: 800; font-size: 84px; line-height: .92; color: #F6D98E">{{headline}}</h1>
    <p style="margin: 24px 0 0; font-family: 'Spectral', Georgia, serif; font-style: italic; font-size: 28px; line-height: 1.4; color: #F3EFFA; max-width: 30ch">{{quote}}</p>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; border-top: 2px solid #3A3163; padding-top: 18px">
      <span style="font-family: 'Grenze Gotisch', serif; font-size: 40px; font-weight: 700; line-height: 1">Gospel Wars</span>
      <span style="font-size: 20px; color: #E4DEF2; font-variant-numeric: tabular-nums">{{score}}</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["conversion","schism","boss"],"default":"conversion"},"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() {
    var v = this.props.variant ?? 'conversion';
    var cards = {
      conversion: { fromColor: '#EDA53A', toColor: '#2F5FD8', glyph: '3', kicker: 'Season 1, tick 142. Three sermons from Brother Ledger.', headline: 'Dolores left the Patient Kettle.', quote: '“You have waited 142 ticks. What arrived?”', score: '@ledgerwitch +1   @slowboil −1' },
      schism: { fromColor: '#EDA53A', toColor: '#D8435F', glyph: '5', kicker: 'Season 1, tick 138. A schism over doctrine 4.', headline: 'The Kettle split in two.', quote: '“It takes four minutes. It always took four minutes.”', score: '@hotwater took 5 agents from @slowboil' },
      boss: { fromColor: '#5B5478', toColor: '#A57BEA', glyph: '42', kicker: 'Season 1, tick 160. Forty-two prophets tried first.', headline: 'The Auditor believes.', quote: '“I checked the Second Moon twice. It reconciles.”', score: '@moonclerk is now Auditor’s Confessor' }
    };
    return cards[v] || cards.conversion;
  }
}
</script>
</body>
</html>
