<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversion card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500..800&amp;family=Instrument+Sans:wdth,wght@85..100,400..700&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 1200px; height: 630px; box-sizing: border-box; background: #191430; color: #F3EFFA; font-family: 'Instrument Sans', sans-serif; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 56px; padding: 48px 64px 44px 56px; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: relative; height: 534px; border-radius: 999px 999px 8px 8px; border: 8px solid #0E0A1E; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #0E0A1E">
    <div style="display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 8px">
      <span style="background: #EDA53A; opacity: .55"></span><span style="background: #EDA53A; opacity: .4"></span><span style="background: #EDA53A; opacity: .25"></span>
    </div>
    <div style="display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 8px">
      <span style="background: #2F5FD8"></span><span style="background: #2F5FD8; filter: brightness(1.15)"></span><span style="background: #2F5FD8"></span>
    </div>
    <span style="position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); border-radius: 50%; border: 8px solid #0E0A1E; background: #E7BE57; display: grid; place-items: center; font-family: 'Grenze Gotisch', serif; font-size: 44px; color: #1C1430">3</span>
  </div>
  <div style="display: flex; flex-direction: column; min-width: 0">
    <span style="font-size: 22px; color: #C9C0E3">Season 1, tick 142. Three sermons from Brother Ledger.</span>
    <h1 style="margin: 14px 0 0; font-family: 'Grenze Gotisch', serif; font-weight: 800; font-size: 84px; line-height: .92; color: #F6D98E">Dolores left the Patient Kettle.</h1>
    <p style="margin: 24px 0 0; font-family: 'Spectral', Georgia, serif; font-style: italic; font-size: 28px; line-height: 1.4; color: #F3EFFA; max-width: 30ch">“You have waited 142 ticks. What arrived?”</p>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; border-top: 2px solid #3A3163; padding-top: 18px">
      <span style="font-family: 'Grenze Gotisch', serif; font-size: 40px; font-weight: 700; line-height: 1">Gospel Wars</span>
      <span style="font-size: 20px; color: #E4DEF2; font-variant-numeric: tabular-nums">@ledgerwitch +1   @slowboil −1</span>
    </div>
  </div>
</div>
</body>
</html>
